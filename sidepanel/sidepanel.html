<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>VocabMaster — Thư viện</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div class="header">
  <div class="header-top">
    <span class="logo">📚 VocabMaster AI</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" id="btn-sidepanel-pdf" title="Mở Trình Đọc &amp; Dịch PDF" style="appearance:none; border:1px solid #45475a; background:rgba(203,166,247,0.12); color:#cba6f7; border-radius:6px; font-size:11px; font-weight:700; padding:3px 7px; cursor:pointer; display:inline-flex; align-items:center; gap:4px;">
        <span>📄</span> Đọc PDF
      </button>
      <a class="settings-link" id="btn-settings" title="Cài đặt">⚙️</a>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="library">📖 Thư viện</button>
    <button class="tab" data-tab="flashcard">🃏 Flashcard</button>
    <button class="tab" data-tab="quiz">🎯 Quiz</button>
    <button class="tab" data-tab="typing">⌨️ Typing</button>
    <button class="tab" data-tab="stats">📊 Tiến độ</button>
  </nav>
</div>

<main>
  <!-- LIBRARY TAB -->
  <div class="pane active" id="pane-library">
    <div id="quick-translate-card" style="display: none; margin-bottom: 12px;"></div>
    <div class="search-row">
      <input type="text" id="search" placeholder="🔍 Tìm từ...">
      <select id="filter">
        <option value="all">Tất cả</option>
        <option value="new">Từ mới</option>
        <option value="learning">Đang học</option>
        <option value="learned">Đã thuộc</option>
      </select>
    </div>
    <div id="vocab-list"></div>
  </div>

  <!-- FLASHCARD TAB -->
  <div class="pane" id="pane-flashcard">
    <div id="fc-wrap"></div>
  </div>

  <!-- QUIZ TAB -->
  <div class="pane" id="pane-quiz">
    <div id="qz-wrap"></div>
  </div>

  <!-- TYPING TAB -->
  <div class="pane" id="pane-typing">
    <div id="ty-wrap"></div>
  </div>

  <!-- STATS TAB -->
  <div class="pane" id="pane-stats">
    <div id="st-wrap"></div>
  </div>
</main>

<script src="sidepanel.js"></script>
</body>
</html>
