name: Deploy VocabMaster AI to GitHub Pages (iPad PWA & Safari Userscript)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Safari Userscript & Orion Extension Zip
        run: |
          mkdir -p _site
          node scripts/build-safari-userscript.mjs
          cp -r index.html ipad utils content icons lib pdf popup settings sidepanel _site/
          node scripts/build-extension-zip.mjs _site/ipad/vocabmaster-extension.zip
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
